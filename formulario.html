<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página formulario</title>
    <link rel="stylesheet" href="./css/estilos.css">
    
</head>


<body>

    <header id="header"> <img src="./logo/logoClinicaDental.png" alt="logotipo DavanteDent">
        <h1>DavanteDent - Cuidado dental con corazón </h1>
    </header>

<form id="formulario-cita">

    <div class="campo">
        <label for="name">Nombre: *</label>
        <input type="text" id="name" name="name" >
        <small class="error" id="error-name"></small>
    </div>

    <div class="campo">
        <label for="surname">Apellido: *</label>
        <input type="text" id="surname" name="surname" >
        <small class="error" id="error-surname"></small>
    </div>

    <div class="campo">
        <label for="phone">Teléfono: *</label>
        <input type="tel" id="phone" name="phone" >
        <small class="error" id="error-phone"></small>
    </div>

    <div class="campo">
        <label for="dni">DNI: *</label>
        <input type="text" id="dni" name="dni" >
        <small class="error" id="error-dni"></small>
    </div>

    <div class="campo">
        <label for="email">Correo: *</label>
        <input type="email" id="email" name="email" >
        <small class="error" id="error-email"></small>
    </div>

    <div class="campo">
        <label for="birthday">Nacimiento: *</label>
        <input type="date" id="birthday" name="birthday">
        <small class="error" id="error-birthday"></small>
    </div>

    <div class="campo">
        <label for="obser">Observaciones:</label>
        <textarea id="obser" name="obser" rows="5"></textarea>
    </div>

    <div class="campo">
        <label for="date">Fecha de la cita:</label>
        <input type="datetime-local" id="date" name="date" >
        <small class="error" id="error-date"></small>
    </div>
<div class="botones-formulario">
    <input id="enviar-cita" type="submit" value="Confirma Cita"> 
    <input type="reset" id="reset-cita" value="Reset">
</div>

</form>

<div class="volver-inicio">
    <a href="index.html">Volver a la página principal</a>
</div>


<footer id="footer">
    <img src="./logo/logoDental.png" alt="logotipo DavanteDent">
<div class="footer-bloque">
    <h3>Dónde estamos</h3>
    <p>C/ Ferrocarril, 51 - 1.º A</p>
    <p>28905 Madrid</p>
</div>

<div class="footer-bloque">
    <h3>Horario de atención</h3>
    <p>Lunes a viernes: 10:00 – 14:00 y 15:00 – 19:00</p>
    <p>Sábados: 9:00 – 15:00</p>
    <p>Domingos y festivos: cerrado</p>
</div>
    </footer>

<script src="./js/formulario.js"></script>
</body>


</html>
